<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#131a23"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4a7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4a7" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2dd4a7" flood-opacity="0.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58636f"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4a7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="430" rx="16" fill="url(#bg)"/>

  <!-- main-path edges -->
  <line x1="196" y1="142" x2="216" y2="142" stroke="#58636f" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="388" y1="142" x2="408" y2="142" stroke="#58636f" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="580" y1="142" x2="600" y2="142" stroke="#58636f" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="772" y1="142" x2="792" y2="142" stroke="#2dd4a7" stroke-width="1.8" marker-end="url(#arrTeal)"/>
  <line x1="964" y1="142" x2="984" y2="142" stroke="#2dd4a7" stroke-width="1.8" marker-end="url(#arrTeal)"/>

  <!-- fallback edges: resolve -> file-swap -> scrub/inject -->
  <path d="M304,184 C304,244 460,236 508,272" fill="none" stroke="#58636f" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M670,308 C800,308 880,254 880,190" fill="none" stroke="#58636f" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- cards: main row -->
  <g>
    <rect x="28" y="100" width="168" height="84" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="112" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">caam run claude</text>
    <text x="112" y="156" text-anchor="middle" font-size="10.5" fill="#8b949e">CLI entry</text>
  </g>
  <g>
    <rect x="220" y="100" width="168" height="84" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="304" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">resolve profile</text>
    <text x="304" y="156" text-anchor="middle" font-size="10.5" fill="#8b949e">.active-token marker</text>
  </g>
  <g>
    <rect x="412" y="100" width="168" height="84" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="496" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">rotate on cooldown</text>
    <text x="496" y="156" text-anchor="middle" font-size="10.5" fill="#8b949e">pick a live token profile</text>
  </g>
  <g>
    <rect x="604" y="100" width="168" height="84" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="688" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">read vault entry</text>
    <text x="688" y="156" text-anchor="middle" font-size="10.5" fill="#8b949e">token (0600) + meta.json</text>
  </g>
  <g>
    <rect x="796" y="100" width="168" height="84" rx="12" fill="url(#glassAccent)" stroke="#2dd4a7" stroke-opacity="0.65" filter="url(#glow)"/>
    <text x="880" y="128" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">scrub + inject env</text>
    <text x="880" y="148" text-anchor="middle" font-size="10" fill="#7ee8c7">CLAUDE_CODE_OAUTH_TOKEN</text>
    <text x="880" y="164" text-anchor="middle" font-size="10" fill="#7ee8c7">CLAUDE_CONFIG_DIR</text>
  </g>
  <g>
    <rect x="988" y="100" width="168" height="84" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1072" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">spawn claude</text>
    <text x="1072" y="156" text-anchor="middle" font-size="10.5" fill="#8b949e">PTY, rate-limit watch</text>
  </g>

  <!-- fallback card -->
  <g>
    <rect x="430" y="272" width="240" height="72" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="550" y="302" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">no token default</text>
    <text x="550" y="322" text-anchor="middle" font-size="10.5" fill="#8b949e">file-swap auth already on disk</text>
  </g>
</svg>
